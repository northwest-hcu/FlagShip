services:
  editor:
    build:
      context: .
      args:
        NODE_MAJOR: "${NODE_MAJOR:-24}"

    ports:
      - "127.0.0.1:5173:5173"

    volumes:
      # Hostで編集したProject SourceをContainerへ反映する
      - type: bind
        source: .
        target: /workspace

      # Alpine用DependencyをHostやE2E環境のnode_modulesと共有しない。
      - type: volume
        source: editor_node_modules
        target: /workspace/node_modules

  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: [test]
    init: true
    shm_size: 1gb
    working_dir: /workspace
    environment:
      CI: "1"
    volumes:
      - type: bind
        source: .
        target: /workspace
      # Ubuntu用DependencyをHostやAlpine Editorのnode_modulesと共有しない。
      - type: volume
        source: e2e_node_modules
        target: /workspace/node_modules
    command: ["sh", "-lc", "npm ci --no-audit --no-fund && npm run test:e2e"]

volumes:
  editor_node_modules:
  e2e_node_modules:
